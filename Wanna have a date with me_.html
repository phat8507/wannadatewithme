<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanna have a date with me?</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde4ee;--bg2:#fff1f6;--paper:#fffbfd;--ink:#5a2a3d;--muted:#a77b8c;--pink:#ee6c9c;--deep:#c93d78;--tape:#f8bfd5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241019;--bg2:#3a1a2a;--paper:#331827;--ink:#fbe4ee;--muted:#c79ab0;--pink:#f48fb1;--deep:#f06292;--tape:#6b2f48}}
:root[data-theme="dark"]{--bg:#241019;--bg2:#3a1a2a;--paper:#331827;--ink:#fbe4ee;--muted:#c79ab0;--pink:#f48fb1;--deep:#f06292;--tape:#6b2f48}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:'Caveat','Segoe Script','Bradley Hand',cursive;color:var(--ink);background:linear-gradient(125deg,var(--bg),var(--bg2),var(--bg));background-size:300% 300%;animation:drift 24s ease-in-out infinite;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
@keyframes drift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;background:var(--pink)}
.b1{width:46vmax;height:46vmax;opacity:.2;top:-18vmax;right:-12vmax;animation:f1 18s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;opacity:.16;bottom:-16vmax;left:-12vmax;animation:f2 22s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(-10vmax,10vmax) scale(1.12)}}
@keyframes f2{to{transform:translate(10vmax,-8vmax) scale(1.1)}}
.paper{position:relative;z-index:2;width:min(90vw,400px);background:var(--paper);border-radius:6px;padding:30px 28px 38px;text-align:center;transform:rotate(-1.6deg);box-shadow:0 1px 2px rgba(120,40,80,.12),0 24px 48px -12px rgba(201,61,120,.28)}
.tape{position:absolute;top:-14px;left:50%;width:96px;height:28px;margin-left:-48px;background:var(--tape);opacity:.85;transform:rotate(3deg)}
.bouquet{width:190px;height:116px;display:block;margin:0 auto 8px;overflow:visible}
.stem{fill:none;stroke:var(--deep);stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1.6s ease-out .2s forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.pt{fill:var(--pink);fill-opacity:.85}
.ct{fill:var(--deep)}
.bloom{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .9s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes pop{to{transform:scale(1)}}
h1{font-size:clamp(42px,12vw,58px);font-weight:700;line-height:1;margin:6px 0 10px;color:var(--deep)}
.line{display:block;width:150px;height:10px;margin:0 auto 16px}
.line path{fill:none;stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1s ease-out 1.4s forwards}
p{margin:0 0 30px;font-size:27px;line-height:1.2;color:var(--muted)}
.btns{display:flex;gap:26px;justify-content:center;align-items:center;min-height:56px}
button{font:600 26px 'Caveat','Segoe Script',cursive;cursor:pointer;background:none;border:0;color:inherit}
#yes{background:var(--deep);color:#fff;padding:8px 38px 10px;border-radius:999px;transition:transform .2s}
#yes:hover{transform:scale(1.07) rotate(-2deg)}
#yes:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
#no{color:var(--muted);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;padding:8px 10px;transition:left .25s ease,top .25s ease}
#msg{margin-top:14px;min-height:30px;font-size:23px;color:var(--muted)}
.win{display:none}.win.show{display:block}
.petal{position:absolute;z-index:1;pointer-events:none;width:14px;height:14px;border-radius:100% 0 100% 0;background:var(--pink);opacity:.75;top:0;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(112vh) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){body,.blob{animation:none}.petal{display:none}.stem,.line path{animation:none;stroke-dashoffset:0}.bloom{animation:none;transform:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<main class="paper">
  <div class="tape"></div>
  <svg class="bouquet" viewBox="0 0 190 116" aria-hidden="true">
    <defs>
      <path id="pt" class="pt" d="M0 0C-8-10-8-22 0-26C8-22 8-10 0 0Z"/>
      <g id="fl"><use href="#pt"/><use href="#pt" transform="rotate(72)"/><use href="#pt" transform="rotate(144)"/><use href="#pt" transform="rotate(216)"/><use href="#pt" transform="rotate(288)"/><circle class="ct" r="4"/></g>
    </defs>
    <path class="stem" pathLength="1" d="M95 116C95 90 92 70 95 46"/>
    <path class="stem" pathLength="1" d="M95 116C90 98 66 86 50 66"/>
    <path class="stem" pathLength="1" d="M95 116C102 98 128 88 142 70"/>
    <g transform="translate(142 62) scale(.8)"><use class="bloom" href="#fl" style="animation-delay:1.1s"/></g>
    <g transform="translate(50 58) scale(.85)"><use class="bloom" href="#fl" style="animation-delay:.95s"/></g>
    <g transform="translate(95 34) scale(1.1)"><use class="bloom" href="#fl" style="animation-delay:.8s"/></g>
  </svg>

  <div id="ask">
    <h1>Wanna have a date with me?</h1>
    <svg class="line" viewBox="0 0 150 10" aria-hidden="true"><path pathLength="1" d="M3 6C30 1 60 9 90 4S130 3 147 5"/></svg>
    <p>I saved the evening for you.</p>
    <div class="btns" id="btns">
      <button id="yes">Yes</button>
      <button id="no">no</button>
    </div>
    <div id="msg" aria-live="polite"></div>
  </div>
  <div id="win" class="win">
    <h1>It's a date.</h1>
    <svg class="line" viewBox="0 0 150 10" aria-hidden="true"><path pathLength="1" d="M3 6C30 1 60 9 90 4S130 3 147 5" style="animation:none;stroke-dashoffset:0"/></svg>
    <p>I'll plan everything. See you soon.</p>
  </div>
</main>

<script>
(function(){
  var no=document.getElementById('no'),msg=document.getElementById('msg');
  var lines=['Nice try.','That one is shy.','Not that button.','So close.','Yes is right there.','You can\'t catch it.'];
  var n=0,moved=false;
  function dodge(e){
    if(e&&e.preventDefault)e.preventDefault();
    if(!moved){moved=true;document.body.appendChild(no);no.style.position='fixed';}
    var m=16,w=no.offsetWidth,h=no.offsetHeight;
    no.style.left=(m+Math.random()*(window.innerWidth-w-2*m))+'px';
    no.style.top=(m+Math.random()*(window.innerHeight-h-2*m))+'px';
    no.style.zIndex=5;
    msg.textContent=lines[n++%lines.length];
  }
  ['mouseenter','touchstart','pointerdown','click','focus'].forEach(function(ev){no.addEventListener(ev,dodge,{passive:false})});
  document.getElementById('yes').addEventListener('click',function(){
    document.getElementById('ask').style.display='none';
    document.getElementById('win').classList.add('show');
    no.style.display='none';
    for(var i=0;i<26;i++){
      var s=document.createElement('span');
      s.className='petal';
      s.style.left=Math.random()*100+'vw';
      s.style.animationDelay=(Math.random()*3)+'s';
      s.style.animationDuration=(5+Math.random()*4)+'s';
      document.body.appendChild(s);
    }
  });
})();
</script>
</body>
</html>
